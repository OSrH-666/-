server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:./data/example_db.db
    driver-class-name: org.sqlite.JDBC
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml

jwt:
  secret: college-student-union-management-system-secret-key
  expiration: 86400000